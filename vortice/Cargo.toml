[package]
name = "vortice"
description = "BEEP (RFC3080/RFC3081) for Rust: async sessions over any transport"
keywords = ["beep", "rfc3080", "rfc3081", "protocol", "tokio"]
categories = ["network-programming", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
bytes = { workspace = true, features = ["std"] }
futures-core = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
vortice-proto = { path = "../vortice-proto", version = "0.0.0" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
vortice-interop = { path = "../vortice-interop" }

[lints]
workspace = true
