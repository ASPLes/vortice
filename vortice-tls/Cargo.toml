[package]
name = "vortice-tls"
description = "The BEEP TLS profile (RFC3080 §3.1) for Vortice, over rustls or native-tls"
keywords = ["beep", "rfc3080", "tls", "rustls"]
categories = ["network-programming", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["rustls"]
# The two backends are not exclusive: both may be on, and the profile works with either. With
# neither, everything but the two backend implementations still compiles, which is what a
# caller bringing its own TLS library builds against.
rustls = ["dep:tokio-rustls", "dep:rustls-pemfile"]
native-tls = ["dep:tokio-native-tls", "dep:native-tls"]

[dependencies]
native-tls = { version = "0.2", features = ["alpn", "alpn-accept"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
tokio = { version = "1", features = ["io-util", "net", "rt"] }
tokio-native-tls = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
tracing = "0.1"
vortice = { path = "../vortice", version = "0.0.0" }

[lints]
workspace = true

[dev-dependencies]
rcgen = "0.14"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
vortice-interop = { path = "../vortice-interop" }
vortice-ws = { path = "../vortice-ws" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
